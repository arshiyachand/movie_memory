name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres for the integration tests (same image as docker-compose.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movie_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_memory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_memory_test
      # prisma.config.ts reads DATABASE_URL; point it at the test DB too.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_memory_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres)
        run: npm run test:integration
