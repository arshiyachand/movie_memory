# Throwaway Postgres for the integration tests (npm run test:integration).
# Port 5433 so it doesn't clash with a Postgres you already run on 5432.
#
#   npm run db:test:up     start it and wait until it accepts connections
#   npm run db:test:down   stop it and delete its data
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_memory_test
    ports:
      - "5433:5432"
    # No volume on purpose: every `up` starts from an empty database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_memory_test"]
      interval: 2s
      timeout: 3s
      retries: 20
